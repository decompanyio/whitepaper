<script>
  (function() {
    const path = window.location.pathname;
    const lambdaApiBase = 'https://redirect.polarishare.io';

    fetch(lambdaApiBase + path)
      .then(res => {
        if (res.status === 301 || res.status === 302) {
          const location = res.headers.get('Location');
          if (location) {
            window.location.href = location;
          } else {
            console.error('리다이렉트 URL이 없습니다');
          }
        } else if (res.status === 404) {
          document.body.innerHTML = '<h1>문서가 없습니다 (404)</h1>';
        } else {
          res.text().then(text => {
            document.body.innerHTML = `<h1>알 수 없는 응답</h1><p>${text}</p>`;
          });
        }
      })
      .catch(err => {
        document.body.innerHTML = `<h1>오류 발생</h1><p>${err.message}</p>`;
      });
  })();
</script>
